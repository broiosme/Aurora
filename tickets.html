<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiket Perjalanan & Kencan Kita — Aurora</title>

    <meta name="description" content="Kumpulan tiket voucher kencan, piknik, dan jalan-jalan seru kita bersama.">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/tickets.css">
    <link rel="stylesheet" href="css/effects/light-bg.css">

    <!-- Theme Initializer -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('aurora-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

</head>

<body class="tickets-body">

    <!-- Background Cosmic Engine -->
    <div class="tickets-bg-engine">
        <canvas id="tickets-stars-canvas"></canvas>
        <div class="tickets-aurora-glow"></div>

        <!-- Light Mode — Ocean Elements -->
        <div class="sun"></div>
        <div class="sun-rays"></div>
        <div class="cloud cloud--1"><div class="cloud__shape"></div></div>
        <div class="cloud cloud--2"><div class="cloud__shape"></div></div>
        <div class="cloud cloud--3"><div class="cloud__shape"></div></div>
        <div class="ocean">
            <div class="ocean__gradient"></div>
            <div class="ocean__wave ocean__wave--1"></div>
            <div class="ocean__wave ocean__wave--2"></div>
            <div class="ocean__wave ocean__wave--3"></div>
            <div class="ocean__shimmer"></div>
        </div>
    </div>

    <!-- Modern Floating Glass Pill Navbar Header -->
    <header class="tickets-nav-header">
        <a href="index.html" class="tickets-nav-header__back" title="Kembali ke Beranda">
            <span>🌌</span> <span class="btn-label">Kembali</span>
        </a>

        <h1 class="tickets-nav-header__title">
            Tiket Kita 🎫
        </h1>

        <div class="tickets-nav-header__actions">
            <button type="button" class="tickets-action-btn" id="open-create-ticket-modal" title="Buat Tiket Baru">
                <span>✨</span> <span class="btn-label">Buat Tiket</span>
            </button>
            <button type="button" class="tickets-action-btn tickets-action-btn--theme" id="theme-toggle" title="Mode Pantai">
                <span>☀️</span> <span class="btn-label">Mode Pantai</span>
            </button>
            <a href="book.html" class="tickets-action-btn" title="Buku Cerita Kita">
                <span>📖</span> <span class="btn-label">Novel</span>
            </a>
            <a href="playlist.html" class="tickets-action-btn" title="Playlist Kita">
                <span>🎵</span> <span class="btn-label">Playlist</span>
            </a>
        </div>
    </header>

    <!-- Main Stage -->
    <main class="tickets-stage">

        <!-- Hero Header -->
        <div class="tickets-hero">
            <p class="tickets-hero__eyebrow">OUR SPECIAL DATE & OUTING COUPONS</p>
            <h2 class="tickets-hero__title">
                Tiket Jalan-Jalan & Kencan Kita<span>.</span>
            </h2>
            <p class="tickets-hero__subtitle">
                Voucher istimewa untuk setiap agenda kencan, piknik pantai, berburu kuliner,<br>hingga tiket bebas pilih mau jalan ke mana saja berdua!
            </p>
        </div>

        <!-- Actions Bar & Category Filter -->
        <div class="tickets-actions-bar">
            <div class="tickets-filter">
                <button type="button" class="tickets-filter-btn is-active" data-filter="all">Semua Tiket</button>
                <button type="button" class="tickets-filter-btn" data-filter="kencan">Kencan Romantis</button>
                <button type="button" class="tickets-filter-btn" data-filter="jalan">Jalan-Jalan</button>
                <button type="button" class="tickets-filter-btn" data-filter="kuliner">Wisata Kuliner</button>
                <button type="button" class="tickets-filter-btn" data-filter="bebas">Voucher Bebas</button>
            </div>
        </div>

        <!-- Ticket Cards Container -->
        <div class="tickets-container" id="tickets-container">
            <!-- Ticket Cards dynamically rendered via JS -->
        </div>

    </main>

    <!-- =========================================
         CREATE TICKET MODAL
    ========================================== -->
    <div class="ticket-modal" id="create-ticket-modal">
        <div class="ticket-modal__content">
            <button type="button" class="ticket-modal__close" id="close-ticket-modal">&times;</button>
            <h3 class="ticket-modal__title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;color:var(--gold);"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/><path d="M13 5v2"/><path d="M13 11v2"/><path d="M13 17v2"/></svg>
                Buat Tiket Jalan-Jalan Baru
            </h3>
            <form id="create-ticket-form" class="ticket-form">
                <div class="ticket-form-group">
                    <label>Judul Aktivitas / Kencan</label>
                    <input type="text" id="ticket-title-input" class="ticket-input" placeholder="Contoh: Nonton Bioskop & Popcorn" required>
                </div>
                <div class="ticket-form-row">
                    <div class="ticket-form-group">
                        <label>Kategori Tiket</label>
                        <select id="ticket-category-select" class="ticket-select">
                            <option value="kencan">Kencan Romantis</option>
                            <option value="jalan">Jalan-Jalan</option>
                            <option value="kuliner">Wisata Kuliner</option>
                            <option value="bebas">Voucher Bebas Request</option>
                        </select>
                    </div>
                    <div class="ticket-form-group">
                        <label>Tema Warna Tiket</label>
                        <select id="ticket-theme-select" class="ticket-select">
                            <option value="rose">Romance Rose 💖</option>
                            <option value="purple">Cosmic Purple 🌌</option>
                            <option value="gold">Sunset Gold ✨</option>
                            <option value="cyan">Ocean Cyan 🌊</option>
                        </select>
                    </div>
                </div>
                <div class="ticket-form-group">
                    <label>Lokasi / Tempat Tujuan</label>
                    <input type="text" id="ticket-location-input" class="ticket-input" placeholder="Contoh: Bioskop XXI / Pantai Sunset" required>
                </div>
                <div class="ticket-form-group">
                    <label>Tanggal & Waktu</label>
                    <input type="text" id="ticket-date-input" class="ticket-input" placeholder="Contoh: Sabtu Malam Ini • 19:30 WIB" required>
                </div>
                <div class="ticket-form-group">
                    <label>Catatan Romantis / Janji Manis</label>
                    <input type="text" id="ticket-note-input" class="ticket-input" placeholder="Contoh: Aku yang traktir es krim rasa vailla ya! 🍦">
                </div>
                <button type="submit" class="ticket-submit-btn">Terbitkan Tiket Kencan ✨</button>
            </form>
        </div>
    </div>

    <!-- Theme Transition Overlay -->
    <div class="theme-transition-overlay" aria-hidden="true"></div>

    <!-- App Script -->
    <script type="module" src="js/ticketsApp.js"></script>

</body>

</html>
